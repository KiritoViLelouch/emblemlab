# Optional backend host. Provision only after choosing an account and checking its current plan.
services:
  - type: web
    name: emblemlab-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEMO
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
